media:
  input: public/uploads
  output: /uploads

content:
  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: heading
        label: Homepage heading
        type: string
      - name: introduction
        label: Introduction
        type: text
        required: true
      - name: title
        label: Site title
        type: string
        description: Leave blank to use your name followed by / Writing.
      - name: description
        label: SEO description
        type: text
        description: Leave blank to use the introduction. Also used in the RSS feed.
      - name: repositoryUrl
        label: Open-source footer repository URL
        type: string
        description: 'Shows "This website is open-source! Use it as a template" with a link to this repository. Leave blank to hide this message. Your website source code must remain open source under AGPL v3.0, the license for this template, even if you hide the message.'
      - name: links
        label: Contact links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: href
            label: URL
            type: string
            description: A web address or mailto link. Leave blank to show a placeholder.

  - name: projects
    label: Projects
    type: file
    path: src/data/projects.json
    format: json
    list: true
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: year
        label: Year
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: href
        label: URL
        type: string
      - name: technologies
        label: Technologies
        type: string
        list: true

  - name: blog
    label: Blog posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, pubDate, tags]
      primary: title
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: pubDate
        label: Publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedDate
        label: Updated date
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: tags
        label: Tags
        type: string
        list: true
      - name: body
        label: Content
        type: rich-text

  - name: about
    label: About
    type: file
    path: src/pages/about.md
    format: yaml-frontmatter
    fields:
      - name: layout
        type: string
        hidden: true
        default: ../layouts/About.astro
      - name: title
        label: Page title
        type: string
        description: Your name is appended automatically.
      - name: description
        label: SEO description
        type: text
        description: Leave blank to use the site introduction.
      - name: body
        label: Content
        type: rich-text
